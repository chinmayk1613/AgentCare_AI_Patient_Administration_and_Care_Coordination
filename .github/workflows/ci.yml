name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agentcare-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-safety:
    name: Repository safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Reject committed environment files
        shell: bash
        run: |
          unexpected_env_files="$(
            git ls-files |
            grep -E '(^|/)\.env($|\.)' |
            grep -v -E '(^|/)\.env\.example$' || true
          )"
          if [ -n "$unexpected_env_files" ]; then
            echo "::error::Committed environment file detected:"
            echo "$unexpected_env_files"
            exit 1
          fi

  python:
    name: Python compile and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile all Python source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile

          files = sorted(Path("backend").rglob("*.py"))
          if not files:
              raise SystemExit("No Python source files found")

          for path in files:
              py_compile.compile(str(path), doraise=True)

          print(f"Compiled {len(files)} Python files")
          PY
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest

  web:
    name: Web lint, build, and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Build
        run: pnpm run build
      - name: Run rendered interface tests
        run: node --test tests/rendered-html.test.mjs
